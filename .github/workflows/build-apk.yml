name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || ls /usr/local/lib/android/sdk 2>/dev/null || true
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin/" 2>/dev/null || true

      - name: Install SDK platform & build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools" > /tmp/sdk-install.log 2>&1 || true
          tail -8 /tmp/sdk-install.log

      - name: Create debug keystore (for release signing)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.9
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Probe Gradle
        if: always()
        run: |
          gradle --version | head -6
          which gradle

      - name: Build release APK
        id: build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/outputs/apk/release
          cp app-release.apk DaijinDuo-v0.1.1.apk
          gh release create v0.1.1 "DaijinDuo-v0.1.1.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DaijinDuo v0.1.1 正式版" \
            --notes "DaijinDuo —— 利用 Android 陀螺仪实现 iPhone DUO 的偏转效果（黑白主题 · 强制内置思源宋体 · 液态玻璃底栏）" || \
            gh release upload v0.1.1 "DaijinDuo-v0.1.1.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daijinduo-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Record failure details
        if: failure()
        run: |
          mkdir -p build-fail-reports
          cp build.log build-fail-reports/build.log 2>/dev/null || true
          cp -r app/build/reports build-fail-reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record failed build" || true
          git push origin HEAD:failed-build-logs --force || true
