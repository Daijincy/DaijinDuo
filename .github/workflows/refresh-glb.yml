name: Refresh GLB byteimg link

# Renews the Volcengine (byteimg) signed URL used as the accelerated download
# source for the 3D GLB model in index.html. The short link
# https://aka.doubaocdn.com/s/cctGM31ekm returns a fresh signed byteimg URL via
# 302; we resolve it and write it back so the page always has a fast,
# CORS-enabled source. byteimg URLs expire after ~7 days, hence this job.
on:
  schedule:
    - cron: '0 3 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch fresh byteimg URL
        run: |
          curl -s -D /tmp/h -o /dev/null --max-time 60 "https://aka.doubaocdn.com/s/cctGM31ekm"
          LOC=$(grep -i '^location:' /tmp/h | sed 's/^[Ll]ocation: //' | tr -d '\r')
          printf '%s' "$LOC" > /tmp/loc.txt
          echo "resolved len=${#LOC}"

      - name: Replace GLB_ACCEL in index.html
        run: |
          python3 - <<'EOF'
          import re
          loc = open('/tmp/loc.txt').read().strip()
          assert loc.startswith('https://'), 'bad loc: ' + loc[:40]
          p = 'index.html'
          s = open(p).read()
          m = re.search(r"GLB_ACCEL = 'https://[^']*'", s)
          assert m, 'GLB_ACCEL marker not found'
          s = s.replace(m.group(0), "GLB_ACCEL = '" + loc + "'")
          open(p, 'w').write(s)
          print('GLB_ACCEL updated ->', loc[:60] + '...')
          EOF

      - name: Commit and push
        run: |
          git config user.name 'DaijinDuo bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(hero): refresh byteimg GLB link [auto]"
            git push origin gh-pages
            echo "pushed"
          else
            echo "no change, skip"
          fi
