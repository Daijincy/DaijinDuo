<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaijinDuo — 维护中</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='14' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3Crect x='13' y='15' width='19' height='34' rx='5.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Crect x='32' y='15' width='19' height='34' rx='5.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{--bg:#000;--ink:#f5f7fa;--dim:#9aa6b5;--line:rgba(255,255,255,.12);--accent:#2997ff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","Songti SC","SimSun","Songti TC",serif;
  background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;overflow:hidden}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ambient::before{content:"";position:absolute;width:560px;height:560px;left:50%;top:44%;transform:translate(-50%,-50%);
  border-radius:50%;filter:blur(130px);background:radial-gradient(circle,rgba(41,151,255,.09),transparent 70%)}
.card{position:relative;z-index:1;text-align:center;padding:0 24px;animation:fadein 1.1s ease both}
.logo{width:62px;height:62px;margin:0 auto 30px;display:block;opacity:.92}
.badge{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:3px;color:var(--dim);
  border:1px solid var(--line);border-radius:100px;padding:7px 16px;margin-bottom:26px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
h1{font-size:clamp(32px,6.5vw,54px);font-weight:900;letter-spacing:10px;margin-bottom:18px;text-indent:10px}
p{font-size:14.5px;color:var(--dim);line-height:2;letter-spacing:1.5px;max-width:28em;margin:0 auto}
p b{color:var(--ink);font-weight:600}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.card{animation:none}.dot{animation:none}}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="card">
  <svg class="logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect x="5" y="5" width="54" height="54" rx="14" stroke="#fff" stroke-width="3.5"/>
    <rect x="13" y="15" width="19" height="34" rx="5.5" stroke="#fff" stroke-width="3"/>
    <rect x="32" y="15" width="19" height="34" rx="5.5" stroke="#fff" stroke-width="3"/>
  </svg>
  <div class="badge"><i class="dot"></i>MAINTENANCE</div>
  <h1>维护中</h1>
  <p>我们正在优化 3D 模型加载体验<br>网站暂时关闭，请稍后再来</p>
</div>
</body>
</html>
